name: time_tracker

description: A Dart object that records time-status changes and can be started,
  paused, resumed, and ended.

version: 1.2.0

topics:
  - time-tracking
  - duration
  - time-log
  - pause
  - resume

homepage: https://github.com/simphotonics/time_tracker

environment:
  sdk: ^3.13.0

dependencies:
  exception_templates: ^1.1.0
  serialize_enum: ^1.0.0
  stride: ^1.2.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
